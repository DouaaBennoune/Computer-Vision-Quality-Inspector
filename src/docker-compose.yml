services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: c-v-q-i-mqtt
    ports:
      - "1883:1883"
    # This automatically configures it to allow local connections
    command: sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.Backend
    container_name: c-v-q-i-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/best.pt:/src/backend/best.pt
      - ./static:/src/static
    depends_on:
    - mqtt-broker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s    
    restart: always
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: c-v-q-i-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000/api/v1/predict
    depends_on:
      backend:
        condition: service_healthy
    restart: always

